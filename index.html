<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Auto — Narração automática</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>🎬 Video Auto</h1>
    <p class="subtitle">Roteiro (inglês) + fotos em sequência → vídeo narrado</p>

    <form id="job-form">
      <label for="script">Roteiro (em inglês)</label>
      <textarea id="script" name="script" rows="8"
        placeholder="Paste your English script here..."></textarea>

      <label for="images">Fotos, na ordem em que aparecem no vídeo</label>
      <input type="file" id="images" name="images" accept="image/*" multiple capture="environment">
      <div id="preview" class="preview-grid"></div>

      <button type="submit" id="submit-btn">Gerar vídeo</button>
    </form>

    <section id="status-box" class="hidden">
      <p id="status-text">Enviando...</p>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <a id="download-btn" class="hidden" download>⬇️ Baixar vídeo</a>
    </section>

    <section id="error-box" class="hidden">
      <p id="error-text"></p>
      <button id="retry-btn">Tentar novamente</button>
    </section>

    <p class="note">
      Obs: o serviço pode "dormir" após um tempo sem uso — a primeira
      chamada pode levar 30 a 60s para acordar. Isso é normal no plano
      gratuito do Render.
    </p>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
